
name: studymate
description: "StudyMate AI - study with your own PDFs."
publish_to: 'none'
version: 1.0.0+1

environment:
    sdk: ^3.5.0

dependencies:
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.8
    http: ^1.2.0
    shared_preferences: ^2.2.0
    file_picker: ^13.1.0
    google_fonts: ^8.2.1
    flutter_markdown_plus: ^1.0.12
    markdown: ^7.3.1
    flutter_secure_storage: 11.2.0
    speech_to_text: ^7.3.0
    flutter_tts: ^4.2.5

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^5.0.0
    flutter_launcher_icons: ^0.14.4

flutter:
    uses-material-design: true

flutter_launcher_icons:
    android: true
    ios: false
    image_path: "assets/images/studymate_logo.png"
    min_sdk_android: 21
    adaptive_icon_background: "#AEEED3"
    adaptive_icon_foreground: "assets/images/studymate_logo.png"
